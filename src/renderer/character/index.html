<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- img-src の mascot-character:：取り込んだキャラクターのサムネイル（rest の1枚目） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: mascot-character:" />
  <title>キャラクター選択</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>キャラクター選択</h1>
    <p class="hint">選ぶとすぐにマスコットに反映されます。</p>

    <ul id="list" class="list" aria-label="キャラクター一覧"></ul>
    <p id="error" class="hint error" hidden></p>

    <div class="actions">
      <button id="create" type="button">キャラクターを作成…</button>
    </div>

    <p class="credit">キャラクター画像は EmoteLab（https://emotelab.app/）とその内蔵アセットを使用して作成しています。</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
