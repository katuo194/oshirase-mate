<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!-- media-src：効果音（assets/sounds）を file: から再生するため。
       connect-src / img-src の mascot-character:：取り込んだキャラクターの画像（Phase 8。メインが userData/characters 配下の検証済みパスだけを返す） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: mascot-character:; connect-src 'self' mascot-character:; media-src 'self' file:" />
  <title>Mascot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<!-- 透明から始め、メインの mascot:visibility でフェードインする（F-20） -->
<body class="concealed">
  <!-- キャラクター枠（200×200。EmoteLab の 400×400 の画像も縮小してこの枠に描く）。吹き出し表示中はウィンドウが拡大されるので、レイアウト通知に合わせて位置だけが動く -->
  <div id="char">
    <canvas id="character" width="200" height="200"></canvas>
    <div id="badge" hidden></div>
    <!-- オフライン表示（F-14）。キャラクター左下。クリックは常に透過 -->
    <div id="offline-badge" hidden title="オフライン">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
        <circle cx="12" cy="19" r="1.6" fill="#fff" />
        <path d="M3 3l18 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round" />
      </svg>
    </div>
  </div>

  <div id="bubble" hidden>
    <div class="body">
      <span class="label"></span>
      <div class="title"></div>
      <div class="sub"></div>
    </div>
    <div class="tail"></div>
  </div>

  <script src="character.js"></script>
  <script src="app.js"></script>
</body>
</html>
